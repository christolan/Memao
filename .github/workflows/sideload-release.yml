# Versioned signed sideload releases for version changes pushed to main.
#
# Repository Actions secrets this workflow reads (names only):
#   MEMAO_KEYSTORE_BASE64
#   MEMAO_STORE_PASSWORD
#   MEMAO_KEY_ALIAS
#   MEMAO_KEY_PASSWORD
#
# AGP 9.4 requires JDK 17 or newer and SDK Build Tools 36.0.0. This repository
# pins the Gradle daemon toolchain to JDK 25, so the job uses Temurin 25.
# compileSdk release(37) resolves to platforms;android-37.0. The release
# keystore is decoded only under RUNNER_TEMP and is never written into the workspace.

name: Sideload release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Check Android version change
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && !github.event.deleted
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - name: Check out repository
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare push versions
        id: compare
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          current="$(python3 .github/scripts/sideload-version.py)"
          if [[ "${BEFORE}" == 0000000000000000000000000000000000000000 ]]; then
            echo "First push to main with Android version ${current}."
          else
            previous="$(python3 .github/scripts/sideload-version.py "${BEFORE}")"
            if [[ "${previous}" == "${current}" ]]; then
              echo "Android version ${current} is unchanged. Skipping the signed release."
              exit 0
            fi
            echo "Android version changed from ${previous} to ${current}."
          fi
          echo 'changed=true' >> "${GITHUB_OUTPUT}"

  release:
    name: Signed sideload APK
    needs: version
    if: github.event_name == 'workflow_dispatch' || needs.version.outputs.changed == 'true'
    permissions:
      contents: write
    concurrency:
      group: memao-sideload-releases
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0

      - name: Require signing secrets
        env:
          MEMAO_KEYSTORE_BASE64: ${{ secrets.MEMAO_KEYSTORE_BASE64 }}
          MEMAO_STORE_PASSWORD: ${{ secrets.MEMAO_STORE_PASSWORD }}
          MEMAO_KEY_ALIAS: ${{ secrets.MEMAO_KEY_ALIAS }}
          MEMAO_KEY_PASSWORD: ${{ secrets.MEMAO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in MEMAO_KEYSTORE_BASE64 MEMAO_STORE_PASSWORD MEMAO_KEY_ALIAS MEMAO_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Decode release keystore
        env:
          MEMAO_KEYSTORE_BASE64: ${{ secrets.MEMAO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore="${RUNNER_TEMP}/memao-release.jks"
          printf '%s' "${MEMAO_KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 -d > "${keystore}"
          if [ ! -s "${keystore}" ]; then
            echo "Decoded keystore is empty."
            exit 1
          fi
          chmod 600 "${keystore}"

      - name: Assemble signed release
        env:
          MEMAO_STORE_FILE: ${{ runner.temp }}/memao-release.jks
          MEMAO_STORE_PASSWORD: ${{ secrets.MEMAO_STORE_PASSWORD }}
          MEMAO_KEY_ALIAS: ${{ secrets.MEMAO_KEY_ALIAS }}
          MEMAO_KEY_PASSWORD: ${{ secrets.MEMAO_KEY_PASSWORD }}
        # Skip the configuration cache so signing passwords are not serialized into it.
        run: ./gradlew :app:assembleRelease --stacktrace --no-configuration-cache

      - name: Verify and stage the APK and update manifest
        id: package
        run: |
          set -euo pipefail
          python3 << 'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import shutil
          import subprocess
          import sys

          release_dir = pathlib.Path("app/build/outputs/apk/release")
          metadata_path = release_dir / "output-metadata.json"
          if not metadata_path.is_file():
              sys.exit("Release output-metadata.json was not produced.")
          metadata = json.loads(metadata_path.read_text())
          elements = metadata.get("elements") or []
          if len(elements) != 1:
              sys.exit(f"Expected one release APK, found {len(elements)}.")
          output_file = str(elements[0].get("outputFile") or "")
          if (
              not output_file
              or output_file != pathlib.Path(output_file).name
              or "unsigned" in output_file.lower()
          ):
              sys.exit(f"Release APK is missing or unsigned: {output_file!r}")
          apk_path = release_dir / output_file
          if not apk_path.is_file():
              sys.exit(f"Release APK was not found at {apk_path}.")

          version = str(elements[0].get("versionName") or "")
          if not re.fullmatch(r"[0-9A-Za-z][0-9A-Za-z._+-]*", version):
              sys.exit(f"Unexpected versionName: {version!r}")
          version_code = elements[0].get("versionCode")
          if type(version_code) is not int or not 0 < version_code <= 2_147_483_647:
              sys.exit(f"Unexpected versionCode: {version_code!r}")

          sdk_root = os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT")
          if not sdk_root:
              sys.exit("ANDROID_HOME is not set, so apksigner cannot be located.")
          signers = list(pathlib.Path(sdk_root).glob("build-tools/*/apksigner"))
          if not signers:
              sys.exit("apksigner was not found under Android SDK build-tools.")

          def version_key(path: pathlib.Path) -> tuple:
              parts = []
              for piece in path.parent.name.split("."):
                  parts.append(int(piece) if piece.isdigit() else 0)
              return tuple(parts)

          runner_temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          apk_name = f"Memao-{version}-release.apk"
          staged_apk = runner_temp / apk_name
          shutil.copy2(apk_path, staged_apk)

          apksigner = max(signers, key=version_key)
          subprocess.run([apksigner, "verify", "--verbose", staged_apk], check=True)
          badging = subprocess.check_output(
              [apksigner.with_name("aapt2"), "dump", "badging", staged_apk], text=True
          )
          package = re.search(
              r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'",
              badging,
              re.MULTILINE,
          )
          if not package or package.groups() != ("com.xiaojiwei.memao", str(version_code), version):
              sys.exit("APK package or version does not match the expected Memao release.")

          digest = hashlib.sha256()
          with staged_apk.open("rb") as apk:
              for chunk in iter(lambda: apk.read(1024 * 1024), b""):
                  digest.update(chunk)
          manifest = runner_temp / f"Memao-{version}-update.json"
          manifest.write_text(
              json.dumps(
                  {
                      "versionCode": version_code,
                      "versionName": version,
                      "fileName": apk_name,
                      "size": staged_apk.stat().st_size,
                      "sha256": digest.hexdigest(),
                  },
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"version_code={version_code}\n")
              output.write(f"apk_name={apk_name}\n")
              output.write(f"apk_path={staged_apk}\n")
              output.write(f"manifest_path={manifest}\n")
          print(f"Staged {apk_name} and {manifest.name}")
          PY

      - name: Upload signed sideload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.apk_name }}
          path: ${{ steps.package.outputs.apk_path }}
          if-no-files-found: error
          archive: "false"

      - name: Publish versioned sideload prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          CODE: ${{ steps.package.outputs.version_code }}
          APK_PATH: ${{ steps.package.outputs.apk_path }}
          APK_NAME: ${{ steps.package.outputs.apk_name }}
          MANIFEST_PATH: ${{ steps.package.outputs.manifest_path }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          ref="refs/tags/${tag}"
          git check-ref-format "${ref}"

          # Each queued version can publish as long as its build is still in main.
          tip="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "${tip}" != "${GITHUB_SHA}" ]; then
            relation="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${tip}" --jq .status)"
            if [[ "${relation}" != ahead ]]; then
              echo "Build commit ${GITHUB_SHA} is outside the current main history. Skipping ${tag}."
              exit 0
            fi
          fi

          # Listing with write access includes drafts and propagates API failures.
          releases="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
            jq -sc --arg tag "${tag}" '[.[][] | select(.tag_name == $tag)]')"
          count="$(jq 'length' <<< "${releases}")"
          if [[ "${count}" != 0 ]]; then
            if jq -e 'all(.[]; .draft == true)' <<< "${releases}" >/dev/null; then
              echo "::error::An unpublished draft already exists for ${tag}. Resolve that draft in GitHub Releases before retrying."
              exit 1
            fi
            if jq -e --arg code "versionCode: ${CODE}" --arg apk "${APK_NAME}" \
              --arg manifest "$(basename "${MANIFEST_PATH}")" '
                length == 1 and (.[0] |
                  .draft == false and
                  (.body | gsub("\r"; "") | split("\n") | index($code) != null) and
                  ([.assets[] | select(.state == "uploaded") | .name] |
                    index($apk) != null and index($manifest) != null))
              ' <<< "${releases}" >/dev/null; then
              echo "Release ${tag} (versionCode ${CODE}) already exists. Skipping publication."
              exit 0
            fi
            echo "::error::Published release ${tag} already has different or incomplete metadata. Increase versionName for a new release."
            exit 1
          fi

          # Claim the ref before adding APKs. A pre-existing ref must point to this build.
          ref_commit="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${tag}" |
            jq -r --arg ref "${ref}" '.[] | select(.ref == $ref) | .object.sha')"
          if [[ -z "${ref_commit}" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=${ref}" -f "sha=${GITHUB_SHA}" >/dev/null
          elif [[ "${ref_commit}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Tag ${tag} already points to another object. Increase versionName for a new release."
            exit 1
          fi

          notes_file="${RUNNER_TEMP}/sideload-notes.md"
          cat > "${notes_file}" <<EOF
          Signed sideload build of Memao ${VERSION}.

          versionCode: ${CODE}

          Commit: ${GITHUB_SHA}
          Download ${APK_NAME} and install it.
          EOF
          gh release create "${tag}" \
            --verify-tag \
            --prerelease \
            --latest=false \
            --title "Memao ${VERSION}" \
            --notes-file "${notes_file}" \
            "${APK_PATH}" "${MANIFEST_PATH}"

      - name: Remove decoded keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/memao-release.jks"
