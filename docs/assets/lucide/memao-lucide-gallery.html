const q=document.getElementById('q'),size=document.getElementById('size'),grid=document.getElementById('grid');
function icon(it,s){return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${it.inner}</svg>`}
function save(name,text,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function render(){grid.innerHTML='';let visible=items.filter(i=>(i.label+' '+i.name+' '+i.semantic).toLowerCase().includes(q.value.toLowerCase()));document.getElementById('count').textContent=`${visible.length} / ${items.length} 个图标`;for(const it of visible){const el=document.createElement('article');el.className='card';el.innerHTML=`<div class="icons">${(size.value==='all'?[20,24,32]:[+size.value]).map(s=>icon(it,s)).join('')}</div><h2>${it.label}</h2><div class="name">${it.name}</div><p class="meta">${it.semantic}</p><div class="actions"><button>下载 SVG</button><button>下载 XML</button></div>`;const bs=el.querySelectorAll('button');bs[0].onclick=()=>save(it.name+'.svg',it.svg,'image/svg+xml');bs[1].onclick=()=>save('ic_lucide_'+it.name.replaceAll('-','_')+'.xml',it.xml,'application/xml');grid.appendChild(el)}}
q.oninput=render;size.onchange=render;document.getElementById('theme').onclick=()=>{const dark=document.body.classList.toggle('dark');document.getElementById('theme').textContent=dark?'切换浅色':'切换深色'};
