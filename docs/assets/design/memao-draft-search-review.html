<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Memao 0.1.30 草稿保存与搜索范围的 Android 交互设计稿">
  <title>草稿保存与搜索范围 · Memao</title>
  <style>
    :root {
      color-scheme: light;
      --board: #f1f1ed;
      --board-ink: #242629;
      --board-secondary: #5d6268;
      --board-rule: #d4d6d2;
      font-family: Geist, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
      color: var(--board-ink);
      background: var(--board);
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--focus, #536789);
      outline-offset: 2px;
    }
    .symbols { position: absolute; width: 0; height: 0; overflow: hidden; }
    .icon { display: inline-block; width: 18px; height: 18px; flex: none; }
    .wrap { width: min(100% - 48px, 970px); margin-inline: auto; }
    .masthead {
      min-height: 71px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--board-rule);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; }
    .brand-mark {
      width: 30px; height: 30px; border-radius: 8px;
      display: grid; place-items: center; background: #e1e2df;
    }
    .brand-mark .icon { width: 19px; height: 19px; }
    .theme {
      min-height: 44px; padding-inline: 13px; border-radius: 8px;
      border: 1px solid var(--board-rule); background: transparent;
      font-size: .8125rem;
    }
    .theme:hover { background: #e5e6e2; }
    main { padding-block: 37px 50px; }
    h1 { margin: 0; font-size: clamp(1.65rem, 4vw, 2.5rem); font-weight: 680; }
    .subtitle { margin: 8px 0 0; font-size: .875rem; color: var(--board-secondary); }
    .board {
      display: grid; grid-template-columns: repeat(2, minmax(0, 412px));
      gap: clamp(36px, 7vw, 146px); margin-top: 29px;
      align-items: start; justify-content: space-between;
    }
    .panel { width: min(100%, 412px); justify-self: center; min-width: 0; }
    .panel-header {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 8px; flex-wrap: wrap; margin-bottom: 9px;
    }
    .panel h2 { margin: 0; font-size: 1.125rem; font-weight: 650; }
    .panel-context { color: var(--board-secondary); font-size: .75rem; }
    .scenes {
      display: flex; flex-wrap: wrap; gap: 2px;
      padding: 3px; border: 1px solid var(--board-rule); border-radius: 10px;
      margin-bottom: 12px;
    }
    .scenes button {
      flex: 1 1 auto; min-height: 44px; padding: 4px 8px;
      border: 0; border-radius: 7px; background: transparent;
      color: var(--board-secondary); font-size: .8125rem;
    }
    .scenes button:hover { background: #e3e4e0; }
    .scenes button[aria-pressed="true"] {
      background: #242629; color: #fff;
    }

    .phone {
      --surface: #fff; --ink: #242629; --secondary: #60666c;
      --rule: #e9ebed; --outline: #c7cbd0; --soft: #f4f5f6;
      --strong: #202327; --on-strong: #fff; --focus: #536789;
      --danger: #a12d34; --error-ground: #fbf0f0;
      min-width: 0; min-height: 635px; display: flex; flex-direction: column;
      color: var(--ink); background: var(--surface);
      border: 1px solid #cbcdc9; border-radius: 26px; overflow: clip;
      box-shadow: 0 7px 25px #1a20140c;
    }
    body[data-theme="dark"] .phone {
      color-scheme: dark;
      --surface: #171819; --ink: #eceeef; --secondary: #a9afb5;
      --rule: #34373b; --outline: #60656b; --soft: #222529;
      --strong: #e7eaee; --on-strong: #1b1e21; --focus: #a0b9e0;
      --danger: #f2a5ab; --error-ground: #332327;
      border-color: #34373b;
    }
    .system-bar {
      min-height: 36px; padding: 5px 20px 0;
      display: flex; align-items: center; justify-content: space-between;
      font-size: .75rem; font-weight: 650; font-variant-numeric: tabular-nums;
    }
    .signals { display: flex; align-items: center; gap: 5px; }
    .signal { background: currentColor; width: 11px; height: 9px; clip-path: polygon(0 100%, 100% 0, 100% 100%); }
    .battery { background: currentColor; width: 8px; height: 11px; border-radius: 2px; position: relative; }
    .battery::before { content: ""; position: absolute; width: 4px; height: 2px; top: -1px; left: 2px; background: currentColor; }
    .screen { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .system-bottom { display: grid; place-items: center; min-height: 22px; }
    .system-bottom::before { content: ""; width: 92px; height: 4px; border-radius: 50px; background: var(--ink); }
    .top-row {
      display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
      min-height: 60px; padding: 5px 12px;
    }
    .top-row h3 { margin: 0; padding-inline: 4px; font-size: 1.0625rem; font-weight: 630; flex: 1 1 auto; }
    .editor-actions { display: flex; gap: 4px; margin-left: auto; }
    .action, .icon-button {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      min-height: 48px; padding: 6px 12px; border: 1px solid transparent;
      border-radius: 8px; background: transparent; font-size: .8125rem;
    }
    .icon-button { width: 48px; flex: 0 0 48px; padding-inline: 0; }
    .action:hover:enabled, .icon-button:hover:enabled { background: var(--soft); }
    .action.primary { background: var(--strong); color: var(--on-strong); min-width: 56px; }
    .action.primary:hover:enabled { opacity: .86; }
    .action.outline { border-color: var(--outline); }
    .action:disabled, .icon-button:disabled { opacity: .43; }
    #editor-screen > .top-row { border-bottom: 1px solid var(--rule); }
    .editor-body {
      flex: 1; display: flex; flex-direction: column; min-height: 210px;
      padding: 21px 21px 12px;
    }
    .editor-body textarea {
      flex: 1; width: 100%; min-height: 180px;
      border: 0; border-radius: 2px; background: transparent; resize: none;
      padding: 0; font-size: 1rem; line-height: 1.85;
    }
    .editor-preview { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.85; }
    .save-strip {
      min-height: 60px; padding: 6px 16px 6px 20px;
      display: flex; justify-content: space-between; align-items: center; gap: 4px 14px;
      flex-wrap: wrap; border-top: 1px solid var(--rule); color: var(--secondary);
    }
    .save-strip[data-state="failed"] { background: var(--error-ground); }
    .visibility { display: inline-flex; align-items: center; gap: 6px; font-size: .75rem; }
    .visibility .icon, .save-feedback .icon { width: 15px; height: 15px; }
    .save-feedback { display: flex; align-items: center; gap: 4px; margin-left: auto; }
    .save-state { display: flex; gap: 5px; align-items: center; font-size: .75rem; }
    .save-strip[data-state="failed"] .save-feedback { color: var(--danger); }
    .retry { padding-inline: 8px; }
    .toolbar {
      display: flex; align-items: center; justify-content: space-around; gap: 8px;
      flex-wrap: wrap; min-height: 49px; padding: 10px 14px;
      border-top: 1px solid var(--rule); color: var(--ink);
    }
    .tools { justify-content: flex-start; gap: 9px 16px; font-size: .8125rem; }
    .tools span { display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; }
    .tools .icon { width: 16px; height: 16px; }
    .outcome {
      flex: 1; display: grid; align-content: center; justify-items: center;
      text-align: center; gap: 9px; padding: 24px 18px;
    }
    .outcome h3, .outcome p { margin: 0; }
    .outcome h3 { font-size: 1.125rem; font-weight: 640; }
    .outcome p { color: var(--secondary); font-size: .875rem; }
    .outcome > .icon { width: 24px; height: 24px; margin-bottom: 6px; }

    .search-top {
      padding: 8px 10px 0 14px; display: flex; align-items: center; gap: 4px;
    }
    .search-field {
      display: flex; align-items: center; min-width: 0; flex: 1; min-height: 52px;
      border: 1px solid var(--outline); border-radius: 8px;
    }
    .search-field:focus-within { border-color: var(--ink); }
    .search-field input {
      min-height: 48px; width: 0; flex: 1; border: 0; border-radius: 2px;
      padding: 0 2px; background: transparent; font-size: 1rem;
    }
    .search-field .icon-button { width: 44px; flex-basis: 44px; }
    .scope {
      padding-inline: 19px;
      min-height: 57px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      font-size: .8125rem; color: var(--secondary);
      border-bottom: 1px solid var(--rule);
    }
    .chip-hit {
      display: inline-flex; align-items: center; flex: 0 1 auto; min-width: 0;
      min-height: 48px; padding: 0; border: 0; border-radius: 8px; background: transparent;
    }
    .chip-face {
      display: inline-flex; align-items: center; min-width: 0;
      gap: 6px; padding: 4px 10px; border: 1px solid var(--outline);
      border-radius: 99px; color: var(--ink); font-size: .8125rem;
    }
    .chip-face span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chip-face .icon { width: 13px; height: 13px; }
    .chip-hit:hover .chip-face { background: var(--soft); }
    .results { flex: 1; min-width: 0; padding-inline: 20px; }
    .empty-results {
      min-height: 255px; display: grid; align-content: center; justify-items: center;
      gap: 9px; padding: 24px 5px; text-align: center;
    }
    .empty-results > .icon { width: 25px; height: 25px; color: var(--secondary); margin-bottom: 5px; }
    .empty-results h3, .empty-results p { margin: 0; }
    .empty-results h3 { font-size: 1.0625rem; font-weight: 640; overflow-wrap: anywhere; }
    .empty-results p { color: var(--secondary); font-size: .8125rem; overflow-wrap: anywhere; }
    .empty-results .action { margin-top: 7px; }
    .result-note { padding: 15px 0 12px; border-bottom: 1px solid var(--rule); }
    .result-note p { margin: 0 0 10px; font-size: .9375rem; line-height: 1.8; overflow-wrap: anywhere; }
    .result-note time, .result-count, .recent-title { color: var(--secondary); font-size: .75rem; }
    .result-count, .recent-title { margin: 15px 0 0; }
    .body-tag {
      white-space: nowrap; padding: 2px 8px; border: 1px solid var(--outline);
      border-radius: 99px; font-size: .8125rem;
    }
    .recent {
      display: flex; align-items: center; gap: 10px; min-height: 48px; width: 100%;
      padding: 6px 0; background: transparent; border: 0;
      border-bottom: 1px solid var(--rule); text-align: left; font-size: .875rem;
    }
    .recent:hover { color: var(--focus); }
    .recent .icon { width: 15px; height: 15px; color: var(--secondary); }
    .notes-top { border-bottom: 1px solid var(--rule); }
    .notes-title {
      display: flex; align-items: center; flex: 1; min-width: 0; gap: 5px;
    }
    .notes-title h3 { flex: none; padding-inline: 0; }
    .notes-top .brand-mark { flex: 0 0 32px; }
    .notes-top .chip-hit { margin-left: 5px; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
    }

    @media (max-width: 725px) {
      .wrap { width: min(100% - 32px, 440px); }
      main { padding-block: 25px 38px; }
      .masthead { min-height: 62px; }
      .board { grid-template-columns: minmax(0, 1fr); margin-top: 24px; }
      .panel { width: 100%; }
      .phone { min-height: 590px; }
    }
  </style>
</head>

  </svg>
  <header class="masthead wrap">
    <div class="brand">
      <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-brand"></use></svg></span>
      <span>Memao</span>
    </div>
    <button class="theme" id="theme" type="button" aria-pressed="false">深色预览</button>
  </header>

  <main class="wrap">
    <h1>草稿保存与搜索范围</h1>
    <p class="subtitle">Android 交互设计稿 · 基于 Memao 0.1.30</p>
    <div class="board">
      <section class="panel" aria-labelledby="editor-heading">
        <div class="panel-header">
          <h2 id="editor-heading">笔记编辑器</h2>
          <span class="panel-context">演示状态</span>
        </div>
        <div class="scenes" role="group" aria-label="模拟编辑器状态" id="editor-scenes">
          <button data-editor="unchanged" aria-pressed="false">未修改</button>
          <button data-editor="saving" aria-pressed="false">保存中</button>
          <button data-editor="saved" aria-pressed="true">已保存</button>
          <button data-editor="failed" aria-pressed="false">失败</button>
          <button data-editor="offline" aria-pressed="false">离线</button>
        </div>
        <div class="phone">
          <div class="system-bar" aria-hidden="true">
            <span>9:41</span><span class="signals"><span class="signal"></span><span class="battery"></span></span>
          </div>
          <div class="screen" id="editor-screen">
            <div class="top-row">
              <button class="icon-button" id="editor-back" aria-label="返回">
                <svg class="icon" aria-hidden="true"><use href="#i-arrow_left"></use></svg>
              </button>
              <h3>编辑记录</h3>
              <div class="editor-actions">
                <button class="action" id="preview">预览</button>
                <button class="action primary" id="send">保存</button>
              </div>
            </div>
            <div class="editor-body">
              <textarea id="draft" aria-label="笔记正文" placeholder="记下此刻的想法…" spellcheck="false">周报补记

核对四季度项目的工期，周五把确认后的时间发给小组。

#工作</textarea>
              <p class="editor-preview" id="editor-preview" hidden></p>
            </div>
            <div class="save-strip" id="save-strip" data-state="saved">
              <span class="visibility">
                <svg class="icon" aria-hidden="true"><use href="#i-lock_keyhole"></use></svg>私密笔记
              </span>
              <div class="save-feedback">
                <span class="save-state" role="status" aria-live="polite">
                  <svg class="icon" id="save-icon" aria-hidden="true"><use href="#i-check"></use></svg>
                  <span id="local-status">草稿已保存到本机</span>
                </span>
                <button class="action retry" id="retry" hidden>重试保存</button>
              </div>
            </div>
            <div class="toolbar" id="format-toolbar" aria-hidden="true">
              <svg class="icon"><use href="#i-heading_1"></use></svg><svg class="icon"><use href="#i-bold"></use></svg>
              <svg class="icon"><use href="#i-italic"></use></svg><svg class="icon"><use href="#i-list"></use></svg>
              <svg class="icon"><use href="#i-list_ordered"></use></svg><svg class="icon"><use href="#i-quote"></use></svg>
              <svg class="icon"><use href="#i-link"></use></svg><svg class="icon"><use href="#i-list_todo"></use></svg>
            </div>
            <div class="toolbar tools" id="attachment-toolbar" aria-hidden="true">
              <span><svg class="icon"><use href="#i-image"></use></svg>图片</span>
              <span><svg class="icon"><use href="#i-audio_lines"></use></svg>音频</span>
              <span><svg class="icon"><use href="#i-clipboard_paste"></use></svg>粘贴图片</span>
              <span><svg class="icon"><use href="#i-tag"></use></svg>标签</span>
            </div>
          </div>
          <div class="screen outcome" id="editor-outcome" hidden>
            <svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg>
            <h3 id="editor-outcome-title" tabindex="-1"></h3>
            <p id="editor-outcome-detail"></p>
            <button class="action outline" id="editor-resume">返回预览编辑器</button>
          </div>
          <div class="system-bottom" aria-hidden="true"></div>
        </div>
      </section>

      <section class="panel" aria-labelledby="search-heading">
        <div class="panel-header">
          <h2 id="search-heading">笔记搜索</h2>
          <span class="panel-context">搜索前的筛选</span>
        </div>
        <div class="scenes" role="group" aria-label="模拟进入搜索前的笔记筛选" id="search-scenes">
          <button data-scope="project" aria-pressed="true">#项目</button>
          <button data-scope="untagged" aria-pressed="false">无标签</button>
          <button data-scope="all" aria-pressed="false">全部笔记</button>
        </div>
        <div class="phone">
          <div class="system-bar" aria-hidden="true">
            <span>9:41</span><span class="signals"><span class="signal"></span><span class="battery"></span></span>
          </div>
          <div class="screen" id="search-screen">
            <form class="search-top" id="search-form">
              <div class="search-field">
                <button type="submit" class="icon-button" aria-label="执行搜索">
                  <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
                </button>
                <input id="keyword" type="search" aria-label="搜索关键词" placeholder="搜索笔记" value="周报" autocomplete="off">
                <button type="button" class="icon-button" id="clear-keyword" aria-label="清除关键词">
                  <svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg>
                </button>
              </div>
              <button type="button" class="action" id="cancel-search">取消</button>
            </form>
            <div class="scope">
              <span>搜索范围</span>
              <button class="chip-hit" id="clear-scope" aria-label="清除标签筛选，搜索全部笔记">
                <span class="chip-face"><span id="scope-chip">#项目</span>
                  <svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg>
                </span>
              </button>
              <span id="all-scope" hidden>全部笔记</span>
            </div>
            <div class="results" id="results"></div>
            <span class="sr-only" id="search-status" role="status" aria-live="polite"></span>
          </div>
          <div class="screen" id="notes-screen" hidden>
            <div class="top-row notes-top">
              <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-brand"></use></svg></span>
              <div class="notes-title">
                <h3>笔记</h3>
                <button class="chip-hit" id="clear-notes-scope" aria-label="清除标签筛选，显示全部笔记">
                  <span class="chip-face"><span id="notes-chip"></span>
                    <svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg>
                  </span>
                </button>
              </div>
              <button class="icon-button" id="open-search" aria-label="搜索笔记">
                <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
              </button>
            </div>
            <div class="results" id="notes-results"></div>
          </div>
          <div class="system-bottom" aria-hidden="true"></div>
        </div>
      </section>
    </div>
  </main>

  <template id="empty-template">
    <div class="empty-results">
      <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
      <h3></h3>
      <p>试试其他关键词。</p>
      <button class="action outline">搜索全部笔记</button>
    </div>
  </template>

  <script>
    const byId = id => document.getElementById(id);
    const markScene = (group, key, selected) => {
      for (const button of byId(group).querySelectorAll("button")) {
        button.setAttribute("aria-pressed", button.dataset[key] === selected);
      }
    };
    byId("theme").addEventListener("click", event => {
      const dark = document.body.dataset.theme === "light";
      document.body.dataset.theme = dark ? "dark" : "light";
      event.currentTarget.setAttribute("aria-pressed", String(dark));
    });

    const draft = byId("draft");
    const initialDraft = draft.value;
    const originalMemo = "周报补记";
    const localMessages = {
      unchanged: "未修改",
      empty: "尚无内容",
      saving: "正在保存草稿…",
      saved: "草稿已保存到本机",
      failed: "草稿保存失败",
    };
    const localIcons = { saving: "refresh_cw", saved: "check", failed: "file_pen_line" };
    let localState = "saved";
    let savedDraft = initialDraft;
    let offline = false;
    let sending = false;
    let previewing = false;
    let editing = true;
    let writeTimer;
    let sendTimer;

    function renderEditor() {
      byId("editor-screen").hidden = !editing;
      byId("editor-outcome").hidden = editing;
      byId("save-strip").dataset.state = localState;
      byId("local-status").textContent = localMessages[localState];
      const icon = localIcons[localState];
      byId("save-icon").hidden = !icon;
      if (icon) byId("save-icon").querySelector("use").setAttribute("href", "#i-" + icon);
      byId("retry").hidden = localState !== "failed";
      byId("send").disabled = offline || sending || !draft.value.trim();
      byId("send").textContent = sending ? "保存中…" : "保存";
      byId("editor-back").disabled = sending;
      byId("preview").disabled = sending;
      byId("preview").textContent = previewing ? "编辑" : "预览";
      draft.readOnly = sending;
      draft.hidden = previewing;
      byId("editor-preview").hidden = !previewing;
      byId("editor-preview").textContent = draft.value || "预览会显示在这里";
      byId("format-toolbar").hidden = previewing;
      markScene("editor-scenes", "editor", offline ? "offline" : localState);
    }

    function chooseEditor(scene) {
      clearTimeout(writeTimer);
      clearTimeout(sendTimer);
      offline = scene === "offline";
      sending = false;
      editing = true;
      previewing = false;
      localState = offline ? "saved" : scene;
      savedDraft = localState === "saved" ? initialDraft : originalMemo;
      draft.value = localState === "unchanged" ? originalMemo : initialDraft;
      renderEditor();
    }

    function saveLocally() {
      clearTimeout(writeTimer);
      const current = draft.value;
      if (current === savedDraft) {
        localState = current === originalMemo ? "unchanged" : "saved";
        renderEditor();
        return;
      }
      if (!current.trim()) {
        localState = "empty";
        renderEditor();
        return;
      }
      localState = "saving";
      renderEditor();
      writeTimer = setTimeout(() => {
        if (draft.value !== current) return;
        savedDraft = current;
        localState = "saved";
        renderEditor();
      }, 850);
    }

    function leaveEditor(title, detail) {
      editing = false;
      byId("editor-outcome-title").textContent = title;
      byId("editor-outcome-detail").textContent = detail;
      renderEditor();
      byId("editor-outcome-title").focus();
    }

    byId("editor-scenes").addEventListener("click", event => {
      const button = event.target.closest("button[data-editor]");
      if (button) chooseEditor(button.dataset.editor);
    });
    draft.addEventListener("input", saveLocally);
    byId("retry").addEventListener("click", () => {
      saveLocally();
      if (!previewing) draft.focus();
    });
    byId("preview").addEventListener("click", () => {
      previewing = !previewing;
      renderEditor();
    });
    byId("editor-back").addEventListener("click", () => {
      if (localState === "failed") {
        byId("retry").focus();
        return;
      }
      clearTimeout(writeTimer);
      savedDraft = draft.value;
      if (savedDraft.trim() && savedDraft !== originalMemo) {
        localState = "saved";
        leaveEditor("已退出编辑", "草稿已保存到本机，可从「草稿」继续编辑。");
      } else {
        leaveEditor("已退出编辑", "没有新增草稿。");
      }
    });
    byId("editor-resume").addEventListener("click", () => {
      chooseEditor(offline ? "offline" : "saved");
      draft.focus();
    });
    byId("send").addEventListener("click", () => {
      clearTimeout(writeTimer);
      sending = true;
      if (draft.value !== savedDraft) localState = "saving";
      renderEditor();
      sendTimer = setTimeout(() => {
        savedDraft = draft.value;
        localState = "saved";
        sending = false;
        leaveEditor("已保存到服务器", "预览中的保存使用示例数据。");
      }, 550);
    });

    const notes = [
      { text: "周报补记。核对四季度项目的工期，周五把确认后的时间发给小组。", scope: "work", date: "2026.11.16  18:20" },
      { text: "下次写周报时，提前把每周待确认的事项记在同一条笔记里。", scope: "untagged", date: "2026.11.15  09:12" },
      { text: "收集项目复盘材料。保留方案原稿、最终排期和上线当天的记录。", scope: "project", date: "2026.11.14  16:45" },
    ];
    const scopeLabels = { project: "#项目", untagged: "无标签", all: "全部笔记" };
    const keyword = byId("keyword");
    const resultPanel = byId("results");
    let listScope = "project";
    let searchScope = listScope;
    let submitted = keyword.value;
    let recent = ["周报", "项目"];

    function notesInScope(scope) {
      return notes.filter(note => scope === "all" || note.scope === scope);
    }

    function makeNote(note) {
      const article = document.createElement("article");
      article.className = "result-note";
      const body = document.createElement("p");
      body.textContent = note.text;
      if (note.scope !== "untagged") {
        const tag = document.createElement("span");
        tag.className = "body-tag";
        tag.textContent = note.scope === "work" ? "#工作" : "#项目";
        body.append(" ", tag);
      }
      const time = document.createElement("time");
      time.textContent = note.date;
      article.append(body, time);
      return article;
    }

    function renderSearch() {
      byId("clear-scope").hidden = searchScope === "all";
      byId("scope-chip").textContent = scopeLabels[searchScope];
      byId("all-scope").hidden = searchScope !== "all";
      byId("clear-keyword").hidden = !keyword.value;
      byId("search-status").textContent = "";
      resultPanel.replaceChildren();
      if (!keyword.value.trim()) {
        const heading = document.createElement("p");
        heading.className = "recent-title";
        heading.textContent = "最近搜索";
        resultPanel.append(heading);
        for (const word of recent) {
          const button = document.createElement("button");
          button.className = "recent";
          button.type = "button";
          button.textContent = word;
          button.addEventListener("click", () => {
            keyword.value = word;
            submitSearch();
            keyword.focus();
          });
          resultPanel.append(button);
        }
        return;
      }
      if (!submitted || submitted !== keyword.value.trim()) return;

      const matches = notesInScope(searchScope).filter(note =>
        note.text.toLowerCase().includes(submitted.toLowerCase()));
      if (!matches.length) {
        const empty = byId("empty-template").content.cloneNode(true);
        empty.querySelector("h3").textContent = "没有匹配的笔记";
        if (searchScope === "project") {
          empty.querySelector("p").textContent = "当前只搜索 #项目。";
        } else if (searchScope === "untagged") {
          empty.querySelector("p").textContent = "当前只搜索未加标签的笔记。";
        }
        const widen = empty.querySelector("button");
        widen.hidden = searchScope === "all";
        widen.onclick = clearSearchScope;
        resultPanel.append(empty);
      } else {
        const count = document.createElement("p");
        count.className = "result-count";
        count.textContent = matches.length + " 条匹配笔记";
        resultPanel.append(count, ...matches.map(makeNote));
      }
      byId("search-status").textContent = scopeLabels[searchScope] + "，" + matches.length + " 条匹配笔记";
    }

    function submitSearch() {
      submitted = keyword.value.trim();
      if (submitted) {
        recent = [submitted, ...recent.filter(value => value !== submitted)].slice(0, 4);
      }
      renderSearch();
    }

    function clearSearchScope() {
      searchScope = "all";
      submitSearch();
      byId("all-scope").setAttribute("tabindex", "-1");
      byId("all-scope").focus();
    }

    function openSearch(sampleKeyword) {
      searchScope = listScope;
      byId("notes-screen").hidden = true;
      byId("search-screen").hidden = false;
      keyword.value = sampleKeyword;
      submitSearch();
    }

    function renderNotes() {
      byId("clear-notes-scope").hidden = listScope === "all";
      byId("notes-chip").textContent = scopeLabels[listScope];
      byId("notes-results").replaceChildren(...notesInScope(listScope).map(note => makeNote(note)));
      markScene("search-scenes", "scope", listScope);
    }

    byId("search-scenes").addEventListener("click", event => {
      const button = event.target.closest("button[data-scope]");
      if (!button) return;
      listScope = button.dataset.scope;
      markScene("search-scenes", "scope", listScope);
      openSearch("周报");
    });
    byId("search-form").addEventListener("submit", event => {
      event.preventDefault();
      submitSearch();
    });
    keyword.addEventListener("input", renderSearch);
    byId("clear-keyword").addEventListener("click", () => {
      keyword.value = "";
      submitSearch();
      keyword.focus();
    });
    byId("clear-scope").addEventListener("click", clearSearchScope);
    byId("cancel-search").addEventListener("click", () => {
      byId("search-screen").hidden = true;
      byId("notes-screen").hidden = false;
      renderNotes();
      byId("open-search").focus();
    });
    byId("clear-notes-scope").addEventListener("click", () => {
      listScope = "all";
      renderNotes();
      byId("open-search").focus();
    });
    byId("open-search").addEventListener("click", () => {
      openSearch("");
      keyword.focus();
    });

    renderEditor();
    renderSearch();
  </script>
