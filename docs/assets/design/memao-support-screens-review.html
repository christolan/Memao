    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;

      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,

      statePersistence,

    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),

  };

    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);

      const source = apply(getMessageSource, event, []);

        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||

        ports.length !== 1

      }

        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

    }

&lt;/style&gt;
&lt;script&gt;
(()=&gt;{
const root=document.getElementById(&#x27;memao-support-screens&#x27;);
const apps=[...root.querySelectorAll(&#x27;.mm-app&#x27;)];
const icon=n=&gt;`&lt;i data-lucide=&quot;${n}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
const esc=s=&gt;String(s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
const visual={theme:&#x27;system&#x27;,space:21,radius:7};
function activeName(s){return s.profiles.find(p=&gt;p.id===s.account)?.name||&#x27;我的 Memos&#x27;;}
const profiles=()=&gt;[{id:1,name:&#x27;我的 Memos&#x27;,url:&#x27;https://memos.example.com&#x27;,user:&#x27;小记&#x27;,drafts:2,expired:false},{id:2,name:&#x27;家里的 Memos&#x27;,url:&#x27;http://memos.lan:5230&#x27;,user:&#x27;小记&#x27;,drafts:1,expired:true}];
const draftSamples=()=&gt;[{id:1,kind:&#x27;新建草稿&#x27;,time:&#x27;今天 · 10:42&#x27;,text:&#x27;把今天值得记住的一件小事写下来。\n\n**不必完整，先留下来。**\n\n#想法&#x27;,photos:1,audio:false},{id:2,kind:&#x27;修改草稿&#x27;,time:&#x27;昨天 · 21:06&#x27;,text:&#x27;沿着湖边再走一段。\n\n下次想早点出门。\n\n#日常&#x27;,photos:2,audio:true}];
const archiveSamples=()=&gt;[{id:1,time:&#x27;10 月 18 日 · 18:20&#x27;,text:&#x27;下午的光，落在墙角。&#x27;,tag:&#x27;日常&#x27;,photos:1},{id:2,time:&#x27;10 月 12 日 · 09:16&#x27;,text:&#x27;小事记下来，\n过些天再看，已经是另一种心情。&#x27;,tag:&#x27;想法&#x27;,photos:0}];
function button(action,label,ic=&#x27;&#x27;,cls=&#x27;&#x27;){return `&lt;button type=&quot;button&quot; data-action=&quot;${action}&quot; class=&quot;${cls}&quot;&gt;${ic?icon(ic):&#x27;&#x27;}${label}&lt;/button&gt;`;}
function top(title,back=&#x27;back&#x27;){return `&lt;header class=&quot;ms-top&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;mm-icon-button&quot; data-action=&quot;${back}&quot; aria-label=&quot;返回&quot;&gt;${icon(&#x27;arrow-left&#x27;)}&lt;/button&gt;&lt;h1&gt;${title}&lt;/h1&gt;&lt;span class=&quot;ms-top-placeholder&quot;&gt;&lt;/span&gt;&lt;/header&gt;`;}
function rail(screen){const selected=[&#x27;drafts&#x27;,&#x27;conflict&#x27;].includes(screen)?&#x27;drafts&#x27;:screen===&#x27;archives&#x27;?&#x27;archives&#x27;:[&#x27;accounts&#x27;,&#x27;settings&#x27;,&#x27;login&#x27;].includes(screen)?&#x27;settings&#x27;:&#x27;notes&#x27;;return `&lt;nav class=&quot;mm-rail&quot; aria-label=&quot;主导航&quot;&gt;&lt;div class=&quot;mm-logo&quot;&gt;m.&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;mm-new&quot; data-action=&quot;new&quot; aria-label=&quot;新建笔记&quot;&gt;${icon(&#x27;plus&#x27;)}&lt;/button&gt;${[[&#x27;notes&#x27;,&#x27;notebook-pen&#x27;,&#x27;笔记&#x27;],[&#x27;drafts&#x27;,&#x27;file-pen-line&#x27;,&#x27;草稿&#x27;],[&#x27;archives&#x27;,&#x27;archive&#x27;,&#x27;归档&#x27;],[&#x27;settings&#x27;,&#x27;settings-2&#x27;,&#x27;设置&#x27;]].map(([key,ic,name])=&gt;`&lt;button type=&quot;button&quot; data-action=&quot;nav-${key}&quot; ${key===selected?&#x27;aria-current=&quot;page&quot;&#x27;:&#x27;&#x27;} class=&quot;${key===&#x27;settings&#x27;?&#x27;mm-bottom-setting&#x27;:&#x27;&#x27;}&quot;&gt;${icon(ic)}&lt;span&gt;${name}&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/nav&gt;`;}
function bottom(screen){return `&lt;footer class=&quot;mm-foot&quot;&gt;&lt;nav class=&quot;mm-nav&quot; aria-label=&quot;底部导航&quot;&gt;${[[&#x27;notes&#x27;,&#x27;notebook-pen&#x27;,&#x27;笔记&#x27;],[&#x27;drafts&#x27;,&#x27;file-pen-line&#x27;,&#x27;草稿&#x27;],[&#x27;archives&#x27;,&#x27;archive&#x27;,&#x27;归档&#x27;],[&#x27;settings&#x27;,&#x27;settings-2&#x27;,&#x27;设置&#x27;]].map(([key,ic,label])=&gt;`&lt;button type=&quot;button&quot; data-action=&quot;nav-${key}&quot; ${screen===key?&#x27;aria-current=&quot;page&quot;&#x27;:&#x27;&#x27;}&gt;${icon(ic)}&lt;span&gt;${label}&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/nav&gt;&lt;div class=&quot;mm-homebar&quot;&gt;&lt;/div&gt;&lt;/footer&gt;`;}
function paneHead(title,extra=&#x27;&#x27;){return `&lt;div class=&quot;ms-detail-head&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;mm-icon-button ms-compact-back&quot; data-action=&quot;pane-back&quot; aria-label=&quot;返回列表&quot;&gt;${icon(&#x27;arrow-left&#x27;)}&lt;/button&gt;&lt;strong&gt;${title}&lt;/strong&gt;${extra}&lt;/div&gt;`;}
function callout(title,copy,error=false){return `&lt;div class=&quot;ms-callout ${error?&#x27;ms-danger-callout&#x27;:&#x27;&#x27;}&quot; ${error?&#x27;role=&quot;alert&quot;&#x27;:&#x27;&#x27;}&gt;&lt;strong&gt;${title}&lt;/strong&gt;${copy}&lt;/div&gt;`;}
function modal(app,title,body,label,fn,danger=true){const wrap=app.querySelector(&#x27;.mm-modal-wrap&#x27;);wrap.innerHTML=`&lt;div class=&quot;mm-modal&quot; role=&quot;alertdialog&quot; aria-modal=&quot;true&quot; aria-label=&quot;${title}&quot;&gt;&lt;h3&gt;${title}&lt;/h3&gt;${body}&lt;div class=&quot;ms-modal-actions&quot;&gt;${button(&#x27;cancel-dialog&#x27;,&#x27;取消&#x27;)}${button(&#x27;confirm-dialog&#x27;,label,&#x27;&#x27;,danger?&#x27;mm-danger&#x27;:&#x27;ms-primary&#x27;)}&lt;/div&gt;&lt;/div&gt;`;wrap.hidden=false;app.ms.confirm=fn;wrap.querySelector(&#x27;[data-action=&quot;cancel-dialog&quot;]&#x27;).focus({preventScroll:true});}
function notice(app,text){const toast=app.querySelector(&#x27;.mm-toast&#x27;);toast.textContent=text;toast.hidden=false;stage();}
function makeLogin(s){return `&lt;div class=&quot;ms-content&quot;&gt;&lt;div class=&quot;ms-login&quot;&gt;&lt;div class=&quot;ms-monogram&quot;&gt;m.&lt;/div&gt;&lt;h1&gt;${s.updateToken?&#x27;更新访问令牌&#x27;:&#x27;连接你的 Memos&#x27;}&lt;/h1&gt;&lt;p&gt;记下此刻，留待日后回看。&lt;br&gt;使用服务器地址与访问令牌连接。&lt;/p&gt;&lt;form data-login novalidate&gt;&lt;label class=&quot;ms-field&quot;&gt;服务器地址&lt;span class=&quot;ms-input-wrap&quot;&gt;&lt;input type=&quot;url&quot; name=&quot;server&quot; aria-label=&quot;服务器地址&quot; placeholder=&quot;https://memos.example.com&quot; autocomplete=&quot;off&quot; spellcheck=&quot;false&quot; value=&quot;${s.updateToken?esc(s.profiles.find(p=&gt;p.id===s.updateToken)?.url||&#x27;&#x27;):&#x27;&#x27;}&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ms-field-error&quot; data-error=&quot;server&quot; role=&quot;alert&quot;&gt;&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;ms-field&quot;&gt;访问令牌&lt;span class=&quot;ms-input-wrap&quot;&gt;&lt;input type=&quot;password&quot; name=&quot;token&quot; aria-label=&quot;访问令牌&quot; placeholder=&quot;粘贴访问令牌&quot; autocomplete=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;button type=&quot;button&quot; data-action=&quot;show-token&quot; aria-label=&quot;显示访问令牌&quot;&gt;${icon(&#x27;eye&#x27;)}&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;ms-field-error&quot; data-error=&quot;token&quot; role=&quot;alert&quot;&gt;&lt;/span&gt;&lt;/label&gt;&lt;div class=&quot;ms-form-footer&quot;&gt;${icon(&#x27;link&#x27;)}支持 HTTP 与 HTTPS 服务器&lt;/div&gt;&lt;button type=&quot;submit&quot; data-action=&quot;connect&quot; class=&quot;ms-primary ms-full&quot;&gt;${s.updateToken?&#x27;验证并更新&#x27;:&#x27;连接服务器&#x27;}&lt;/button&gt;&lt;/form&gt;${s.profiles.length?button(&#x27;nav-accounts&#x27;,&#x27;返回账号列表&#x27;,&#x27;&#x27;,&#x27;ms-text-button&#x27;):&#x27;&#x27;}&lt;/div&gt;&lt;div class=&quot;ms-login-footer&quot;&gt;${icon(&#x27;lock-keyhole&#x27;)}你的记录保存在自己的服务器&lt;/div&gt;&lt;div class=&quot;mm-homebar&quot;&gt;&lt;/div&gt;&lt;/div&gt;`;}
function makeAccounts(s){return `&lt;div class=&quot;ms-content&quot;&gt;${top(&#x27;服务器账号&#x27;,&#x27;nav-settings&#x27;)}&lt;div class=&quot;ms-body&quot;&gt;&lt;div class=&quot;ms-section-label&quot;&gt;已保存的账号&lt;/div&gt;${s.profiles.map(p=&gt;`&lt;div class=&quot;ms-profile&quot; data-profile=&quot;${p.id}&quot;&gt;&lt;div class=&quot;ms-profile-top&quot;&gt;&lt;span class=&quot;ms-avatar&quot;&gt;${p.id===1?&#x27;M&#x27;:&#x27;H&#x27;}&lt;/span&gt;&lt;div class=&quot;ms-profile-main&quot;&gt;&lt;div class=&quot;ms-profile-title&quot;&gt;&lt;span&gt;${p.name}&lt;/span&gt;&lt;span&gt;${s.account===p.id?&#x27;当前使用&#x27;:&#x27;&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ms-profile-url&quot;&gt;${p.url}&lt;br&gt;${p.user}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ms-profile-detail&quot;&gt;${p.drafts} 份未发送草稿${p.expired?&#x27; · 令牌已失效&#x27;:&#x27;&#x27;}&lt;/div&gt;${p.expired?callout(&#x27;需要更新令牌&#x27;,&#x27;本地缓存和草稿仍保留。更新后可继续连接。&#x27;):&#x27;&#x27;}&lt;div class=&quot;ms-profile-actions&quot;&gt;${s.account!==p.id?`&lt;button type=&quot;button&quot; data-switch=&quot;${p.id}&quot;&gt;切换&lt;/button&gt;`:&#x27;&#x27;}&lt;button type=&quot;button&quot; data-token=&quot;${p.id}&quot;&gt;更新令牌&lt;/button&gt;&lt;button type=&quot;button&quot; data-remove-account=&quot;${p.id}&quot; class=&quot;mm-danger&quot;&gt;删除&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;div class=&quot;ms-action-line&quot;&gt;${button(&#x27;add-account&#x27;,&#x27;添加账号&#x27;,&#x27;plus&#x27;,&#x27;ms-secondary&#x27;)}&lt;/div&gt;&lt;p class=&quot;ms-muted&quot; style=&quot;margin-top:30px&quot;&gt;切换账号会保留各自的缓存和草稿。&lt;br&gt;从列表删除账号只清理该账号的本地数据。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;ms-footnote&quot;&gt;服务器与账号分别保存，数据不会混用。&lt;/div&gt;&lt;/div&gt;`;}
function makeSettings(s){return `&lt;div class=&quot;ms-content&quot;&gt;${top(&#x27;设置&#x27;,&#x27;nav-offline&#x27;)}&lt;div class=&quot;ms-body&quot;&gt;&lt;div class=&quot;ms-section-label&quot;&gt;外观&lt;/div&gt;&lt;div class=&quot;ms-setting-row&quot;&gt;&lt;span&gt;主题模式&lt;/span&gt;&lt;select data-theme aria-label=&quot;主题模式&quot;&gt;&lt;option value=&quot;system&quot; ${visual.theme===&#x27;system&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;跟随系统&lt;/option&gt;&lt;option value=&quot;light&quot; ${visual.theme===&#x27;light&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;浅色&lt;/option&gt;&lt;option value=&quot;dark&quot; ${visual.theme===&#x27;dark&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;深色&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;div class=&quot;ms-section-label&quot; style=&quot;margin-top:33px&quot;&gt;服务器&lt;/div&gt;&lt;div class=&quot;ms-setting-row&quot;&gt;&lt;span&gt;服务器账号&lt;small&gt;${s.profiles.length} 个已保存账号&lt;/small&gt;&lt;/span&gt;${button(&#x27;nav-accounts&#x27;,&#x27;管理&#x27;,&#x27;chevron-right&#x27;)}&lt;/div&gt;&lt;div class=&quot;ms-section-label&quot; style=&quot;margin-top:33px&quot;&gt;设备存储&lt;/div&gt;&lt;div class=&quot;ms-setting-row&quot;&gt;&lt;span&gt;可清理缓存&lt;small data-cache-size&gt;${s.cache} MB&lt;/small&gt;&lt;/span&gt;${button(&#x27;clear-cache&#x27;,&#x27;清理&#x27;)}&lt;/div&gt;${callout(&#x27;草稿始终保留&#x27;,&#x27;清理缓存不会删除未发送草稿，也不会删除草稿中的图片和音频。&#x27;)}&lt;div class=&quot;ms-setting-row&quot;&gt;&lt;span&gt;未发送草稿&lt;small&gt;${s.drafts.length} 份，仅保存在本机&lt;/small&gt;&lt;/span&gt;${button(&#x27;nav-drafts&#x27;,&#x27;查看&#x27;,&#x27;chevron-right&#x27;)}&lt;/div&gt;&lt;div class=&quot;ms-settings-bottom&quot;&gt;Memao&lt;br&gt;连接自己的 Memos，记录自己的生活。&lt;/div&gt;&lt;/div&gt;${bottom(&#x27;settings&#x27;)}&lt;/div&gt;`;}
function draftList(s,conflict=false){return `&lt;aside class=&quot;mm-list&quot;&gt;&lt;div class=&quot;ms-list-title&quot;&gt;&lt;div class=&quot;ms-list-account&quot;&gt;${esc(activeName(s))} ${icon(&#x27;chevron-down&#x27;)}&lt;/div&gt;&lt;h1&gt;草稿&lt;/h1&gt;&lt;p class=&quot;ms-muted&quot;&gt;按最近编辑时间排列&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;mm-feed&quot;&gt;${s.drafts.length?s.drafts.map(d=&gt;`&lt;article class=&quot;ms-list-row ${s.selectedDraft===d.id?&#x27;ms-active&#x27;:&#x27;&#x27;}&quot;&gt;&lt;div class=&quot;ms-list-meta&quot;&gt;&lt;span&gt;${d.kind}&lt;/span&gt;&lt;span&gt;${d.time}&lt;/span&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;ms-list-copy&quot; data-draft=&quot;${d.id}&quot;&gt;${esc(d.text)}&lt;/button&gt;&lt;div class=&quot;ms-list-attachment&quot;&gt;${icon(d.audio?&#x27;file-audio&#x27;:&#x27;image&#x27;)}${d.photos} 张图片${d.audio?&#x27; · 1 个音频&#x27;:&#x27;&#x27;}&lt;/div&gt;${d.id===2&amp;&amp;conflict?&#x27;&lt;div class=&quot;ms-muted&quot; style=&quot;margin-top:9px&quot;&gt;服务端有新版本&lt;/div&gt;&#x27;:&#x27;&#x27;}&lt;/article&gt;`).join(&#x27;&#x27;):&#x27;&lt;div class=&quot;mm-empty&quot;&gt;没有未发送草稿&lt;/div&gt;&#x27;}&lt;/div&gt;${bottom(&#x27;drafts&#x27;)}&lt;/aside&gt;`;}
function draftDetail(s){const d=s.drafts.find(d=&gt;d.id===s.selectedDraft);if(!d)return `&lt;main class=&quot;mm-detail&quot;&gt;${paneHead(&#x27;草稿&#x27;)}&lt;div class=&quot;ms-empty-view&quot;&gt;&lt;span class=&quot;ms-empty-symbol&quot;&gt;${icon(&#x27;file-pen-line&#x27;)}&lt;/span&gt;&lt;h2&gt;暂时没有草稿&lt;/h2&gt;&lt;p&gt;未发送的内容会自动保存在这里。&lt;/p&gt;&lt;/div&gt;&lt;/main&gt;`;return `&lt;main class=&quot;mm-detail&quot;&gt;${paneHead(d.kind,`&lt;button type=&quot;button&quot; class=&quot;mm-icon-button&quot; data-remove-draft=&quot;${d.id}&quot; aria-label=&quot;删除草稿&quot;&gt;${icon(&#x27;trash-2&#x27;)}&lt;/button&gt;`)}&lt;div class=&quot;ms-pane-body&quot;&gt;&lt;div class=&quot;ms-pane-date&quot;&gt;最后编辑于 ${d.time}&lt;/div&gt;${s.draftEditing?`&lt;textarea class=&quot;ms-draft-editor&quot; aria-label=&quot;草稿正文&quot;&gt;${esc(d.text)}&lt;/textarea&gt;`:`&lt;div class=&quot;ms-draft-copy&quot;&gt;${esc(d.text)}&lt;/div&gt;`}${d.photos?`&lt;div class=&quot;ms-draft-photos ${d.photos&gt;1?&#x27;ms-multiple&#x27;:&#x27;&#x27;}&quot;&gt;${Array.from({length:d.photos},(_,i)=&gt;`&lt;div class=&quot;ms-photo&quot; role=&quot;img&quot; aria-label=&quot;草稿第 ${i+1} 张图片示例&quot;&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}${d.audio?`&lt;div class=&quot;ms-list-attachment&quot;&gt;${icon(&#x27;file-audio&#x27;)}雨落在窗台.m4a · 1:23&lt;/div&gt;`:&#x27;&#x27;}${callout(&#x27;已保存在本机&#x27;,&#x27;包含草稿中的图片和音频，联网后由你手动发送。&#x27;)}${s.localSaveFailed?callout(&#x27;本地保存失败&#x27;,&#x27;暂时无法写入设备存储。请先释放空间再重试；当前编辑内容仍保留。&#x27;,true):&#x27;&#x27;}${d.id===2?button(&#x27;show-conflict&#x27;,&#x27;查看版本冲突&#x27;,&#x27;git-compare-arrows&#x27;,&#x27;ms-secondary&#x27;):&#x27;&#x27;}&lt;/div&gt;&lt;div class=&quot;ms-pane-footer&quot;&gt;&lt;span&gt;${s.localSaveFailed?&#x27;保存失败&#x27;:&#x27;已保存到本机&#x27;}&lt;/span&gt;${button(s.draftEditing?&#x27;finish-edit&#x27;:&#x27;edit-draft&#x27;,s.draftEditing?&#x27;保存并返回&#x27;:&#x27;继续编辑&#x27;,&#x27;&#x27;, &#x27;ms-primary&#x27;)}&lt;/div&gt;&lt;/main&gt;`;}
function makeArchives(s){const n=s.archives.find(n=&gt;n.id===s.selectedArchive);return `&lt;aside class=&quot;mm-list&quot;&gt;&lt;div class=&quot;ms-list-title&quot;&gt;&lt;div class=&quot;ms-list-account&quot;&gt;${esc(activeName(s))} ${icon(&#x27;chevron-down&#x27;)}&lt;/div&gt;&lt;h1&gt;归档&lt;/h1&gt;&lt;p class=&quot;ms-muted&quot;&gt;已归档的个人笔记&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;mm-feed&quot;&gt;${s.archives.length?s.archives.map(n=&gt;`&lt;article class=&quot;ms-list-row ${s.selectedArchive===n.id?&#x27;ms-active&#x27;:&#x27;&#x27;}&quot;&gt;&lt;div class=&quot;ms-list-meta&quot;&gt;${n.time}&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;ms-list-copy&quot; data-archive-note=&quot;${n.id}&quot;&gt;${esc(n.text)}&lt;/button&gt;&lt;div class=&quot;ms-list-attachment&quot;&gt;# ${n.tag}${n.photos?&#x27; · 1 张图片&#x27;:&#x27;&#x27;}&lt;/div&gt;&lt;/article&gt;`).join(&#x27;&#x27;):&#x27;&lt;div class=&quot;mm-empty&quot;&gt;归档列表为空&lt;/div&gt;&#x27;}&lt;/div&gt;${bottom(&#x27;archives&#x27;)}&lt;/aside&gt;&lt;main class=&quot;mm-detail&quot;&gt;${paneHead(&#x27;已归档笔记&#x27;,n?button(&#x27;restore-archive&#x27;,&#x27;取消归档&#x27;,&#x27;archive-restore&#x27;,&#x27;ms-secondary&#x27;):&#x27;&#x27;)}${n?`&lt;div class=&quot;ms-pane-body&quot;&gt;&lt;div class=&quot;ms-pane-date&quot;&gt;创建于 ${n.time}&lt;/div&gt;&lt;p&gt;${esc(n.text)}&lt;/p&gt;${n.photos?&#x27;&lt;div class=&quot;ms-photo&quot; role=&quot;img&quot; aria-label=&quot;归档图片示例&quot;&gt;&lt;/div&gt;&#x27;:&#x27;&#x27;}&lt;div class=&quot;ms-list-attachment&quot;&gt;# ${n.tag}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ms-pane-footer&quot;&gt;&lt;span&gt;取消归档后恢复到主列表&lt;/span&gt;${icon(&#x27;lock-keyhole&#x27;)}&lt;/div&gt;`:&#x27;&lt;div class=&quot;ms-empty-view&quot;&gt;&lt;span class=&quot;ms-empty-symbol&quot;&gt;&#x27;+icon(&#x27;archive&#x27;)+&#x27;&lt;/span&gt;&lt;h2&gt;没有归档笔记&lt;/h2&gt;&lt;p&gt;归档用于收起暂时不需要的内容。&lt;/p&gt;&lt;/div&gt;&#x27;}&lt;/main&gt;`;}
function offlineList(s){return `&lt;aside class=&quot;mm-list&quot;&gt;&lt;div class=&quot;ms-list-title&quot;&gt;&lt;div class=&quot;ms-list-account&quot;&gt;${esc(activeName(s))} ${icon(&#x27;chevron-down&#x27;)}&lt;/div&gt;&lt;h1&gt;笔记&lt;/h1&gt;&lt;/div&gt;&lt;div class=&quot;ms-offline&quot;&gt;${icon(&#x27;wifi-off&#x27;)}&lt;div&gt;&lt;strong&gt;当前离线&lt;/strong&gt;只显示本机已缓存的内容&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;mm-feed&quot;&gt;&lt;label class=&quot;mm-find&quot; style=&quot;margin-top:18px&quot;&gt;${icon(&#x27;search&#x27;)}&lt;input type=&quot;search&quot; data-offline-search placeholder=&quot;搜索缓存笔记&quot; aria-label=&quot;搜索缓存笔记&quot;&gt;&lt;/label&gt;&lt;div class=&quot;ms-muted&quot; style=&quot;margin-top:11px&quot;&gt;搜索范围仅限缓存&lt;/div&gt;&lt;article class=&quot;ms-list-row&quot; data-cached-note&gt;&lt;div class=&quot;ms-list-meta&quot;&gt;今天 · 09:05&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;ms-list-copy&quot; data-action=&quot;open-cached&quot;&gt;沿着湖边走了一小段。\n风很轻，刚好适合发呆。&lt;/button&gt;&lt;div class=&quot;ms-list-attachment&quot;&gt;# 日常&lt;/div&gt;&lt;/article&gt;&lt;div class=&quot;mm-empty&quot; data-offline-empty hidden&gt;缓存中没有匹配内容&lt;br&gt;联网后可搜索服务端笔记&lt;/div&gt;&lt;/div&gt;${bottom(&#x27;notes&#x27;)}&lt;/aside&gt;`;}
function offlineDetail(s){return `&lt;main class=&quot;mm-detail&quot;&gt;${paneHead(&#x27;缓存笔记&#x27;,`&lt;button type=&quot;button&quot; class=&quot;ms-secondary&quot; data-action=&quot;offline-edit&quot; ${s.completeCache?&#x27;&#x27;:&#x27;disabled&#x27;}&gt;${icon(&#x27;pencil&#x27;)}编辑&lt;/button&gt;`)}&lt;div class=&quot;ms-pane-body&quot;&gt;&lt;div class=&quot;ms-pane-date&quot;&gt;10 月 25 日 · 09:05&lt;/div&gt;&lt;p&gt;沿着湖边走了一小段。\n风很轻，刚好适合发呆。&lt;/p&gt;&lt;div class=&quot;ms-photo&quot; role=&quot;img&quot; aria-label=&quot;已缓存图片示例&quot;&gt;&lt;/div&gt;${s.completeCache?&#x27;&lt;div class=&quot;ms-photo&quot; role=&quot;img&quot; aria-label=&quot;已缓存的另一张图片示例&quot;&gt;&lt;/div&gt;&#x27;:`&lt;div class=&quot;ms-photo-missing&quot;&gt;${icon(&#x27;image-off&#x27;)}另一张图片尚未缓存&lt;small&gt;联网后可查看&lt;/small&gt;&lt;/div&gt;`}&lt;div class=&quot;ms-list-attachment&quot;&gt;# 日常&lt;/div&gt;${s.completeCache?callout(&#x27;可离线编辑&#x27;,&#x27;这条笔记及附件已完整缓存。修改先保存为本地草稿，联网后手动发送。&#x27;):callout(&#x27;当前仅可浏览&#x27;,&#x27;附件尚未完整缓存，暂不可离线编辑。请联网补齐附件后再编辑；已保存的草稿不受影响。&#x27;)}&lt;/div&gt;&lt;div class=&quot;ms-pane-footer&quot;&gt;&lt;span&gt;${s.completeCache?&#x27;笔记及附件已完整缓存&#x27;:&#x27;附件未完整缓存 · 仅可浏览&#x27;}&lt;/span&gt;${icon(&#x27;wifi-off&#x27;)}&lt;/div&gt;&lt;/main&gt;`;}
function makeFailure(s){const unknown=s.failure===&#x27;unknown&#x27;,auth=s.failure===&#x27;auth&#x27;,save=s.failure===&#x27;save&#x27;;return `&lt;div class=&quot;ms-content&quot;&gt;${top(&#x27;修改草稿&#x27;,&#x27;nav-drafts&#x27;)}&lt;div class=&quot;ms-body&quot;&gt;&lt;div class=&quot;ms-pane-date&quot;&gt;我的 Memos · 已保存在本机&lt;/div&gt;&lt;div class=&quot;ms-draft-copy&quot;&gt;沿着湖边再走一段。\n下次想早点出门。\n\n#日常&lt;/div&gt;&lt;div class=&quot;ms-photo&quot; role=&quot;img&quot; aria-label=&quot;草稿图片示例&quot;&gt;&lt;/div&gt;${unknown?callout(&#x27;发送结果尚未确认&#x27;,&#x27;请求超时，但服务器可能已收到内容。核对前请勿重复创建。&#x27;,true):auth?callout(&#x27;访问令牌已失效&#x27;,&#x27;请更新当前账号的令牌。草稿和附件仍保留在本机。&#x27;,true):save?callout(&#x27;本地保存失败&#x27;,&#x27;设备存储暂时无法写入。当前输入仍保留，请释放空间后重试。&#x27;,true):callout(&#x27;图片未能上传&#x27;,&#x27;连接中断，笔记尚未完成发送。正文与附件仍保留在草稿中。&#x27;,true)}${!unknown&amp;&amp;!auth&amp;&amp;!save?`&lt;div class=&quot;ms-upload-item&quot;&gt;&lt;span class=&quot;ms-file-icon&quot;&gt;${icon(&#x27;image&#x27;)}&lt;/span&gt;&lt;div&gt;湖边的光.jpg&lt;small&gt;上传失败 · 原文件已保留&lt;/small&gt;&lt;/div&gt;${button(&#x27;retry-upload&#x27;,&#x27;重试&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}&lt;div class=&quot;ms-action-line&quot;&gt;${button(&#x27;nav-drafts&#x27;,&#x27;返回草稿&#x27;)}${button(unknown?&#x27;verify-result&#x27;:auth?&#x27;update-active-token&#x27;:save?&#x27;retry-local&#x27;:&#x27;retry-send&#x27;,unknown?&#x27;核对发送结果&#x27;:auth?&#x27;更新令牌&#x27;:save?&#x27;重试保存&#x27;:&#x27;重新发送&#x27;,&#x27;&#x27;, &#x27;ms-primary&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ms-footnote&quot;&gt;未发送草稿不会自动发布。&lt;/div&gt;&lt;/div&gt;`;}

    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
