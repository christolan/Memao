    phone.innerHTML = `&lt;div class=&quot;m-status&quot;&gt;&lt;span&gt;9:41&lt;/span&gt;&lt;span class=&quot;m-status-icons&quot;&gt;${icon(&#x27;signal&#x27;)}${icon(&#x27;wifi&#x27;)}${icon(&#x27;battery-full&#x27;)}&lt;/span&gt;&lt;/div&gt;&lt;header class=&quot;m-top&quot;&gt;&lt;div class=&quot;m-topline&quot;&gt;&lt;span class=&quot;m-wordmark&quot;&gt;${cfg.brand}&lt;/span&gt;&lt;button class=&quot;m-account&quot; type=&quot;button&quot; data-action=&quot;accounts&quot; aria-label=&quot;切换服务器账号&quot;&gt;&lt;span class=&quot;m-account-dot&quot;&gt;&lt;/span&gt;&lt;span data-account-name&gt;${selectedAccount}&lt;/span&gt;${icon(&#x27;chevron-down&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;m-heading&quot;&gt;&lt;div&gt;${cfg.kicker?`&lt;div class=&quot;m-kicker&quot;&gt;${cfg.kicker}&lt;/div&gt;`:&#x27;&#x27;}&lt;h1&gt;${cfg.title}&lt;/h1&gt;&lt;/div&gt;&lt;small&gt;${cfg.date}&lt;/small&gt;&lt;/div&gt;&lt;/header&gt;&lt;label class=&quot;m-search&quot;&gt;${icon(&#x27;search&#x27;)}&lt;input type=&quot;search&quot; placeholder=&quot;搜索笔记…&quot; aria-label=&quot;搜索当前账号未归档笔记&quot;&gt;&lt;/label&gt;&lt;div class=&quot;m-tags&quot; role=&quot;group&quot; aria-label=&quot;标签单选筛选&quot;&gt;&lt;button type=&quot;button&quot; data-select-tag=&quot;&quot; aria-pressed=&quot;true&quot;&gt;全部&lt;/button&gt;&lt;button type=&quot;button&quot; data-select-tag=&quot;日常&quot; aria-pressed=&quot;false&quot;&gt;日常&lt;/button&gt;&lt;button type=&quot;button&quot; data-select-tag=&quot;旅行&quot; aria-pressed=&quot;false&quot;&gt;旅行&lt;/button&gt;&lt;button type=&quot;button&quot; data-select-tag=&quot;灵感&quot; aria-pressed=&quot;false&quot;&gt;灵感&lt;/button&gt;&lt;/div&gt;&lt;main class=&quot;m-feed&quot;&gt;&lt;div class=&quot;m-day&quot;&gt;&lt;strong&gt;${key===&#x27;paper&#x27;?&#x27;25&#x27;:&#x27;今天&#x27;}&lt;/strong&gt;&lt;span&gt;${key===&#x27;editorial&#x27;?&#x27;OCTOBER / 2026&#x27;:&#x27;周日 · 10 月 25 日&#x27;}&lt;/span&gt;&lt;/div&gt;${demoNotes.map(noteMarku     const overlay = phone.querySelector(&#x27;.m-overlay&#x27;);

    function filter(){const q=phone.querySelector(&#x27;input[type=&quot;search&quot;]&#x27;).value.trim().toLowerCase();let visible=0;phone.querySelectorAll(&#x27;[data-note]&#x27;).forEach(el=&gt;{const n=demoNotes[Number(el.dataset.note)];const text=(n.text.replace(/&lt;br&gt;/g,&#x27;&#x27;)+&#x27; &#x27;+n.tag+(n.kind===&#x27;audio&#x27;?&#x27; 晚风与树叶&#x27;:&#x27;&#x27; )).toLowerCase();el.hidden=!!((selectedTag&amp;&amp;selectedTag!==n.tag)||(q&amp;&amp;!text.includes(q)));if(!el.hidden)visible++;});phone.querySelector(&#x27;.m-empty&#x27;).hidden=visible&gt;0;phone.querySelectorAll(&#x27;.m-tags [data-select-tag]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;,String(b.dataset.selectTag===selectedTag)));phone.querySelector(&#x27;.m-day&#x27;).hidden=visible===0;}
